# Publish to npm from CI.
# Runs when a release tag (from `yarn release`) is pushed, or by hand from the
# Actions tab (it then publishes the version in package.json on the chosen branch).
# No `--provenance`: npm only signs provenance for public source repositories,
# and this one is private (E422 on v1.7.0). Add it back if the repo goes public.
# One-time: add an NPM_TOKEN repository secret (an automation token from the
# npm account or org that owns the package).

name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
