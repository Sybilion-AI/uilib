name: dist check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dist-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Assert dist matches committed output
        run: git diff --exit-code dist
